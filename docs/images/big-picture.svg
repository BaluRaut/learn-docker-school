<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .band1 { fill: #fff; stroke: #0ea5e9; stroke-width: 3; }
    .band2 { fill: #fff; stroke: #ea580c; stroke-width: 3; }
    .bx  { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
    .bxb { fill: #fff; stroke: #0ea5e9; stroke-width: 2.5; }
    .bxo { fill: #fff; stroke: #ea580c; stroke-width: 2.5; }
    .tip  { fill: #f0f9ff; stroke: #0ea5e9; stroke-width: 1.5; }
    .win  { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
    .title { font-size: 36px; font-weight: 800; fill: #0f172a; }
    .bandt { font-size: 26px; font-weight: 800; }
    .t  { font-size: 19px; font-weight: 600; fill: #0f172a; }
    .s  { font-size: 15px; fill: #475569; }
    .m  { text-anchor: middle; }
    .arr  { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arw); }
    .dash { stroke-dasharray: 8 7; }
    .ntb { font-size: 15px; font-weight: 700; fill: #fff; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="1920" height="1160" fill="#ffffff"/>
  <text class="title m" x="960" y="52">The Big Picture — PACK IT on your laptop, SHIP IT to ECR</text>

  <!-- ═══ BAND 1: PACK IT ═══ -->
  <rect class="band1" x="40" y="80" width="1840" height="470" rx="20"/>
  <text class="bandt" x="70" y="122" fill="#0ea5e9">🐳 PART 1 — PACK IT: Docker on your laptop (lessons 1–8)</text>

  <rect class="bxb" x="70" y="170" width="240" height="130" rx="14"/>
  <text class="t m" x="190" y="205">🧑‍💻 your code</text>
  <text class="s m" x="190" y="233">server.js</text>
  <text class="s m" x="190" y="257">+ 📝 Dockerfile (recipe)</text>
  <text class="s m" x="190" y="281">+ 🙈 .dockerignore</text>

  <rect class="bxb" x="400" y="150" width="330" height="180" rx="14"/>
  <text class="t m" x="565" y="185">🎂 build = bake the layers</text>
  <rect class="bx" x="430" y="270" width="270" height="38" rx="8"/>
  <text class="s m" x="565" y="295">FROM node:20-alpine (cached)</text>
  <rect class="bx" x="430" y="240" width="270" height="24" rx="6"/>
  <text class="s m" x="565" y="257">WORKDIR · ENV · USER (cached)</text>
  <rect class="bx" x="430" y="200" width="270" height="34" rx="8"/>
  <text class="s m" x="565" y="222">COPY server.js — rebuilt on edit ✏️</text>

  <rect class="bxb" x="820" y="170" width="250" height="130" rx="14"/>
  <text class="t m" x="945" y="205">🧊 image</text>
  <text class="s m" x="945" y="233">hello-school:v1</text>
  <text class="s m" x="945" y="257">frozen, immutable,</text>
  <text class="s m" x="945" y="281">ready to open anywhere</text>

  <rect class="bxb" x="1160" y="150" width="330" height="180" rx="14"/>
  <text class="t m" x="1325" y="185">🍽️ containers — lunch time</text>
  <rect class="bx" x="1185" y="205" width="130" height="60" rx="8"/>
  <text class="s m" x="1250" y="240">📦 box 1</text>
  <rect class="bx" x="1330" y="205" width="130" height="60" rx="8"/>
  <text class="s m" x="1395" y="240">📦 box 2</text>
  <text class="s m" x="1325" y="295">-p 3000:3000 🪟 · -e VERSION=v2 · logs · exec</text>

  <rect class="bxb" x="1580" y="170" width="270" height="130" rx="14"/>
  <text class="t m" x="1715" y="205">🍽️🍽️ compose</text>
  <text class="s m" x="1715" y="233">web + proxy, one file,</text>
  <text class="s m" x="1715" y="257">one command — services</text>
  <text class="s m" x="1715" y="281">call each other BY NAME 📞</text>

  <line class="arr" x1="310" y1="235" x2="396" y2="235"/>
  <g transform="translate(353,215)"><circle r="13" fill="#0ea5e9"/><text class="ntb" dy="5">1</text></g>
  <text class="s m" x="353" y="268">docker build</text>
  <line class="arr" x1="730" y1="235" x2="816" y2="235"/>
  <g transform="translate(773,215)"><circle r="13" fill="#0ea5e9"/><text class="ntb" dy="5">2</text></g>
  <line class="arr" x1="1070" y1="235" x2="1156" y2="235"/>
  <g transform="translate(1113,215)"><circle r="13" fill="#0ea5e9"/><text class="ntb" dy="5">3</text></g>
  <text class="s m" x="1113" y="268">docker run</text>
  <line class="arr dash" x1="1490" y1="235" x2="1576" y2="235"/>
  <g transform="translate(1533,215)"><circle r="13" fill="#0ea5e9"/><text class="ntb" dy="5">4</text></g>

  <rect class="tip" x="70" y="400" width="560" height="110" rx="14"/>
  <text class="t m" x="350" y="440">🎂 cache trick (lesson 02)</text>
  <text class="s m" x="350" y="470">rarely-changing lines at the bottom, code on top</text>
  <text class="s m" x="350" y="494">→ rebuilds take seconds, forever</text>
  <rect class="tip" x="670" y="400" width="560" height="110" rx="14"/>
  <text class="t m" x="950" y="440">👨‍🍳 multi-stage (lesson 07)</text>
  <text class="s m" x="950" y="470">cook with all the tools, ship only the result</text>
  <text class="s m" x="950" y="494">kitchen ~180MB → lunchbox ~50MB</text>
  <rect class="tip" x="1270" y="400" width="580" height="110" rx="14"/>
  <text class="t m" x="1560" y="440">🏷️ hygiene (lesson 08)</text>
  <text class="s m" x="1560" y="470">real tags (never :latest) · USER node, not root</text>
  <text class="s m" x="1560" y="494">.dockerignore secrets · small base images</text>
  <g transform="translate(70,400)"><circle r="13" fill="#0ea5e9"/><text class="ntb" dy="5">5</text></g>

  <!-- ═══ divider ═══ -->
  <text class="t m" x="960" y="588" fill="#475569">the lunchbox's journey 🍱 — packed on your laptop → filed in the bank 🏦 → served in the cluster ☸️</text>

  <!-- ═══ BAND 2: SHIP IT ═══ -->
  <rect class="band2" x="40" y="610" width="1840" height="510" rx="20"/>
  <text class="bandt" x="70" y="652" fill="#ea580c">☁️ PART 2 — SHIP IT: registries &amp; AWS ECR (lessons 9–12)</text>

  <rect class="bxo" x="70" y="700" width="310" height="130" rx="14"/>
  <text class="t m" x="225" y="735">🏷️ address the box</text>
  <text class="s m" x="225" y="763">docker tag hello-school:v1</text>
  <text class="s m" x="225" y="787">ACCOUNT.dkr.ecr.REGION.</text>
  <text class="s m" x="225" y="809">amazonaws.com/hello-school:v1</text>

  <rect class="bxo" x="70" y="960" width="310" height="120" rx="14"/>
  <text class="t m" x="225" y="995">🎫 the 12-hour day pass</text>
  <text class="s m" x="225" y="1023">aws ecr get-login-password</text>
  <text class="s m" x="225" y="1047">| docker login … (IAM checks ID)</text>

  <rect class="bxo" x="700" y="690" width="520" height="290" rx="16"/>
  <text class="t m" x="960" y="725">🏦 ECR — your private bank locker</text>
  <rect class="bx" x="730" y="745" width="210" height="60" rx="10"/>
  <text class="s m" x="835" y="770">📦 v3 · v2 · abc123…</text>
  <text class="s m" x="835" y="792">IMMUTABLE tags</text>
  <rect class="bx" x="960" y="745" width="230" height="60" rx="10"/>
  <text class="s m" x="1075" y="770">🛡️ scan on push</text>
  <text class="s m" x="1075" y="792">every image checked</text>
  <rect class="bx" x="730" y="820" width="210" height="60" rx="10"/>
  <text class="s m" x="835" y="845">🧹 lifecycle janitor</text>
  <text class="s m" x="835" y="867">keep newest 10</text>
  <rect class="bx" x="960" y="820" width="230" height="60" rx="10"/>
  <text class="s m" x="1075" y="845">🔐 private by default</text>
  <text class="s m" x="1075" y="867">IAM decides who enters</text>
  <text class="s m" x="960" y="945">rented as code: ecr/ecr.tf + lifecycle-policy.json</text>

  <rect class="bxo" x="1540" y="700" width="310" height="180" rx="14"/>
  <text class="t m" x="1695" y="735">☸️ EKS cluster pulls it</text>
  <text class="s m" x="1695" y="763">deployment.yaml says:</text>
  <text class="s m" x="1695" y="787">image: ACCOUNT.dkr…/hello-school:v3</text>
  <text class="s m" x="1695" y="815">kubelet fetches the box</text>
  <text class="s m" x="1695" y="839">and opens it on a node 🍱</text>

  <line class="arr" x1="380" y1="765" x2="696" y2="765"/>
  <g transform="translate(538,745)"><circle r="13" fill="#ea580c"/><text class="ntb" dy="5">3</text></g>
  <text class="s m" x="538" y="798">docker push</text>
  <g transform="translate(70,700)"><circle r="13" fill="#ea580c"/><text class="ntb" dy="5">1</text></g>
  <g transform="translate(70,960)"><circle r="13" fill="#ea580c"/><text class="ntb" dy="5">2</text></g>
  <line class="arr dash" x1="380" y1="1000" x2="660" y2="830"/>
  <line class="arr" x1="1220" y1="770" x2="1536" y2="770"/>
  <g transform="translate(1378,750)"><circle r="13" fill="#ea580c"/><text class="ntb" dy="5">4</text></g>
  <text class="s m" x="1378" y="803">pulled at deploy time</text>

  <rect class="win" x="700" y="1000" width="560" height="90" rx="14"/>
  <text class="t m" x="980" y="1035">📮 lesson 12: CI does ALL of this on every push</text>
  <text class="s m" x="980" y="1063">test → build → tag with commit SHA → 12h pass → push → scanned</text>
  <rect class="win" x="1300" y="1000" width="550" height="90" rx="14"/>
  <text class="t m" x="1575" y="1035">🎓 then the trilogy continues</text>
  <text class="s m" x="1575" y="1063">☸️ Kubernetes RUNS the images · 🤖 ArgoCD DEPLOYS them from git</text>
  <g transform="translate(700,1000)"><circle r="13" fill="#ea580c"/><text class="ntb" dy="5">5</text></g>
  <g transform="translate(1300,1000)"><circle r="13" fill="#ea580c"/><text class="ntb" dy="5">6</text></g>
</svg>
